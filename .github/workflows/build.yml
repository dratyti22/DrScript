name: Test Build (Develop)

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_ext: .zip
            rust_target: x86_64-pc-windows-msvc
            asset_name_prefix: dr-script-ide-windows-debug
            build_output_dir: dr_script_flutter/build/windows/x64/runner/Release

          - os: ubuntu-latest
            artifact_ext: .tar.gz
            rust_target: x86_64-unknown-linux-gnu
            asset_name_prefix: dr-script-ide-linux-debug
            build_output_dir: dr_script_flutter/build/linux/x64/release/bundle

          - os: macos-latest
            artifact_ext: .zip
            rust_target: x86_64-apple-darwin
            asset_name_prefix: dr-script-ide-macos-debug
            build_output_dir: dr_script_flutter/build/macos/Build/Products/Release

    steps:
      - uses: actions/checkout@v4

      # --- 1. УСТАНОВКА ---
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev tar

      # --- 2. СБОРКА RUST ---
      - name: Build Rust Library
        run: cargo build --release --lib --target ${{ matrix.rust_target }}

      # --- 3. СБОРКА FLUTTER ---
      - name: Flutter dependencies
        working-directory: dr_script_flutter
        run: flutter pub get

      - name: Build app (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: dr_script_flutter
        run: flutter build windows --release

      - name: Build app (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: dr_script_flutter
        run: flutter build linux --release

      - name: Build app (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: dr_script_flutter
        run: |
          cp ../target/${{ matrix.rust_target }}/release/libdr_script.dylib macos/Runner/
          flutter build macos --release

      # --- 4. КОПИРОВАНИЕ БИБЛИОТЕК ---
      - name: Copy DLL (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: cp target/${{ matrix.rust_target }}/release/dr_script.dll ${{ matrix.build_output_dir }}/

      - name: Copy SO (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: cp target/${{ matrix.rust_target }}/release/libdr_script.so ${{ matrix.build_output_dir }}/

      # --- 5. АРХИВАЦИЯ (Чтобы скачать удобный zip/tar.gz из Artifacts) ---
      - name: Compress (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: Compress-Archive -Path ${{ matrix.build_output_dir }}\* -DestinationPath ${{ matrix.asset_name_prefix }}${{ matrix.artifact_ext }}

      - name: Compress (Linux/macOS)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        shell: bash
        run: |
          cd ${{ matrix.build_output_dir }}
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            tar -czvf $GITHUB_WORKSPACE/${{ matrix.asset_name_prefix }}${{ matrix.artifact_ext }} .
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            zip -r $GITHUB_WORKSPACE/${{ matrix.asset_name_prefix }}${{ matrix.artifact_ext }} dr_script_flutter.app
          fi

      - name: Upload Test Build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name_prefix }}
          path: ${{ matrix.asset_name_prefix }}${{ matrix.artifact_ext }}