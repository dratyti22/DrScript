name: Release Dr Script IDE

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Dr Script IDE ${{ github.ref }}
        draft: false
        prerelease: false

  build-and-upload:
    needs: release
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
        - os: windows-latest
          artifact_name: dr-script-ide-windows.zip
          asset_name: dr-script-ide-windows-${{ github.ref_name }}.zip
        - os: ubuntu-latest
          artifact_name: dr-script-ide-linux.tar.gz
          asset_name: dr-script-ide-linux-${{ github.ref_name }}.tar.gz
    
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
        
    - name: Build Dr Script library (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cd ..
        cargo build --release --lib
        copy target\release\dr_script.dll dr_script_flutter\windows\runner\
        
    - name: Build Dr Script library (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cd ..
        cargo build --release --lib
        cp target/release/libdr_script.so dr_script_flutter/
        
    - name: Flutter dependencies
      run: flutter pub get
      
    - name: Build app
      run: |
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          flutter build windows --release
        else
          flutter build linux --release
        fi
      shell: bash
      
    - name: Package Windows
      if: matrix.os == 'windows-latest'
      run: |
        cd build/windows/x64/runner/Release
        7z a ../../../../../${{ matrix.artifact_name }} *
        
    - name: Package Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        cd build/linux/x64/release
        tar -czf ../../../../${{ matrix.artifact_name }} bundle/
        
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.release.outputs.upload_url }}
        asset_path: ./${{ matrix.artifact_name }}
        asset_name: ${{ matrix.asset_name }}
        asset_content_type: application/octet-stream