name: Release Dr Script IDE

on:
  push:
    branches:
      - develop

jobs:
  create_release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Dr Script IDE ${{ github.ref }}
        draft: false
        prerelease: false

  build-and-upload:
    needs: create_release
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
        - os: windows-latest
          artifact_ext: .zip
          asset_ext: .zip
          rust_target: x86_64-pc-windows-msvc
          asset_name_prefix: dr-script-ide-windows
        - os: ubuntu-latest
          artifact_ext: .tar.gz
          asset_ext: .tar.gz
          rust_target: x86_64-unknown-linux-gnu
          asset_name_prefix: dr-script-ide-linux
        - os: macos-latest
          artifact_ext: .zip
          asset_ext: .zip
          rust_target: x86_64-apple-darwin
          asset_name_prefix: dr-script-ide-macos

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    # --- 1. Установка окружения ---

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        target: ${{ matrix.rust_target }}

    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

    # --- 2. Сборка RUST FFI ---

    - name: Build Rust Library
      run: cargo build --release --lib --target ${{ matrix.rust_target }}

    # --- 3. Размещение FFI Библиотек (ИСПРАВЛЕНО: РАЗДЕЛЕНО НА ШАГИ) ---

    - name: Copy FFI Library (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        copy target\${{ matrix.rust_target }}\release\dr_script.dll dr_script_flutter\windows\runner\dr_script.dll
      shell: cmd

    - name: Copy FFI Library (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cp target/${{ matrix.rust_target }}/release/libdr_script.so dr_script_flutter/
      shell: bash

    - name: Copy FFI Library (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        cp target/${{ matrix.rust_target }}/release/libdr_script.dylib dr_script_flutter/macos/Runner/
      shell: bash

    # --- 4. Сборка FLUTTER ---

    - name: Flutter dependencies
      working-directory: dr_script_flutter
      run: flutter pub get

    - name: Build app
      working-directory: dr_script_flutter
      run: |
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          flutter build windows --release
        elif [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
          flutter build linux --release
        elif [ "${{ matrix.os }}" == "macos-latest" ]; then
          flutter build macos --release
        fi
      shell: bash

    # --- 5. Упаковка и Загрузка ---

    - name: Set Artifact Name
      id: set_artifact_name
      run: |
        # Формируем имя артефакта заранее
        ARTIFACT_NAME="${{ matrix.asset_name_prefix }}-${{ github.ref_name }}${{ matrix.artifact_ext }}"
        echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
      shell: bash

    - name: Package Windows
      if: matrix.os == 'windows-latest'
      run: |
        $ARTIFACT_NAME = "${{ steps.set_artifact_name.outputs.artifact_name }}"
        cd dr_script_flutter\build\windows\x64\runner\Release
        7z a ..\..\..\..\$ARTIFACT_NAME *
        Move-Item ..\..\..\..\$ARTIFACT_NAME $env:GITHUB_WORKSPACE
      shell: pwsh

    - name: Package Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        ARTIFACT_NAME="${{ steps.set_artifact_name.outputs.artifact_name }}"
        tar -czf "$ARTIFACT_NAME" -C dr_script_flutter/build/linux/x64/release bundle
      shell: bash

    - name: Package macOS
      if: matrix.os == 'macos-latest'
      run: |
        ARTIFACT_NAME="${{ steps.set_artifact_name.outputs.artifact_name }}"
        cd dr_script_flutter/build/macos/Build/Products/Release/
        zip -r -9 "../../$ARTIFACT_NAME" Dr_Script_Ide.app
        mv ../../$ARTIFACT_NAME $GITHUB_WORKSPACE/
      shell: bash

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create_release.outputs.upload_url }}
        asset_path: ./${{ steps.set_artifact_name.outputs.artifact_name }}
        asset_name: ${{ steps.set_artifact_name.outputs.artifact_name }}
        asset_content_type: application/octet-stream