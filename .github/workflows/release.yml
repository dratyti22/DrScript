name: Release Dr Script IDE

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_ext: .zip
            rust_target: x86_64-pc-windows-msvc
            asset_name_prefix: dr-script-ide-windows
            # Точный путь, куда Flutter кладет exe
            build_output_dir: dr_script_flutter/build/windows/x64/runner/Release

          - os: ubuntu-latest
            artifact_ext: .tar.gz
            rust_target: x86_64-unknown-linux-gnu
            asset_name_prefix: dr-script-ide-linux
            # Точный путь, куда Flutter кладет бинарник Linux
            build_output_dir: dr_script_flutter/build/linux/x64/release/bundle

          - os: macos-latest
            artifact_ext: .zip
            rust_target: x86_64-apple-darwin
            asset_name_prefix: dr-script-ide-macos
            # Точный путь к .app файлу
            build_output_dir: dr_script_flutter/build/macos/Build/Products/Release

    steps:
      - uses: actions/checkout@v4

      # --- 1. Установка зависимостей ---
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev tar

      # --- 2. Компиляция Rust (FFI) ---
      - name: Build Rust Library
        run: cargo build --release --lib --target ${{ matrix.rust_target }}

      # --- 3. Подготовка к сборке Flutter (Flutter Pub Get) ---
      - name: Flutter dependencies
        working-directory: dr_script_flutter
        run: flutter pub get

      # --- 4. Сборка приложений (FLUTTER BUILD) ---

      - name: Build app (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: dr_script_flutter
        run: flutter build windows --release

      - name: Build app (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: dr_script_flutter
        run: flutter build linux --release

      - name: Build app (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: dr_script_flutter
        # Для macOS копируем dylib ДО сборки, чтобы она попала в бандл (особенность Mac)
        run: |
          cp ../target/${{ matrix.rust_target }}/release/libdr_script.dylib macos/Runner/
          flutter build macos --release

      # --- 5. КОПИРОВАНИЕ БИБЛИОТЕК В ГОТОВЫЙ БИЛД (Самое важное!) ---

      # Windows: Берем DLL и кладем РЯДОМ с .exe в папку Release (как в твоем примере)
      - name: Copy DLL to Build Folder (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          copy target\${{ matrix.rust_target }}\release\dr_script.dll ${{ matrix.build_output_dir }}\
        shell: cmd

      # Linux: Берем .so и кладем в папку bundle (рядом с исполняемым файлом)
      - name: Copy SO to Build Folder (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp target/${{ matrix.rust_target }}/release/libdr_script.so ${{ matrix.build_output_dir }}/
        shell: bash

      # --- 6. АРХИВАЦИЯ ГОТОВОГО ПРИЛОЖЕНИЯ ---

      - name: Compress Build (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path ${{ matrix.build_output_dir }}\* -DestinationPath ${{ matrix.asset_name_prefix }}${{ matrix.artifact_ext }}
        shell: powershell

      - name: Compress Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd ${{ matrix.build_output_dir }}
          tar -czvf ../../../../../../${{ matrix.asset_name_prefix }}${{ matrix.artifact_ext }} .
        shell: bash

      - name: Compress Build (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd ${{ matrix.build_output_dir }}
          # zip -r <куда сохранить> <что сохранить (.app)>
          zip -r ../../../../../../${{ matrix.asset_name_prefix }}${{ matrix.artifact_ext }} dr_script_flutter.app
        shell: bash

      # --- 7. ЗАГРУЗКА РЕЛИЗА ---
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.asset_name_prefix }}${{ matrix.artifact_ext }}