<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Dr Script IDE - Web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #0D1117;
            color: #E6EDF3;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: #58A6FF;
            text-align: center;
        }
        
        .editor-container {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        
        .editor {
            flex: 1;
        }
        
        textarea {
            width: 100%;
            height: 300px;
            background: #161B22;
            color: #E6EDF3;
            border: 1px solid #30363D;
            border-radius: 6px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
        }
        
        .output {
            flex: 1;
            background: #161B22;
            border: 1px solid #30363D;
            border-radius: 6px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            white-space: pre-wrap;
            overflow-y: auto;
            height: 300px;
        }
        
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 10px 5px 10px 0;
        }
        
        button:hover {
            background: #2EA043;
        }
        
        button:disabled {
            background: #484F58;
            cursor: not-allowed;
        }
        
        .examples {
            margin: 20px 0;
        }
        
        .example-btn {
            background: #21262D;
            border: 1px solid #30363D;
            margin: 5px;
        }
        
        .example-btn:hover {
            background: #30363D;
        }
        
        .loading {
            color: #F85149;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔬 Dr Script IDE</h1>
        
        <div class="examples">
            <button class="example-btn" onclick="loadExample('basic')">Базовый пример</button>
            <button class="example-btn" onclick="loadExample('variables')">Переменные</button>
            <button class="example-btn" onclick="loadExample('conditions')">Условия</button>
            <button class="example-btn" onclick="loadExample('loops')">Циклы</button>
            <button class="example-btn" onclick="loadExample('functions')">Функции</button>
        </div>
        
        <div class="editor-container">
            <div class="editor">
                <h3>Код:</h3>
                <textarea id="code" placeholder="Введите код Dr Script здесь...">print(42);
print(10 + 5);

ver x = 10;
var y = 5;

if x > y {
    print(1);
} else {
    print(0);
}</textarea>
            </div>
            
            <div class="editor">
                <h3>Вывод:</h3>
                <div id="output" class="output">Нажмите "Запустить" для выполнения кода...</div>
            </div>
        </div>
        
        <button id="runBtn" onclick="runCode()">▶️ Запустить</button>
        <button onclick="clearOutput()">🗑️ Очистить</button>
    </div>

    <script type="module">
        import init, { run_dr_script, init_panic_hook } from './pkg/dr_script_web.js';
        
        let wasmReady = false;
        
        async function initWasm() {
            try {
                await init();
                init_panic_hook();
                wasmReady = true;
                document.getElementById('output').textContent = 'Dr Script готов к работе!';
            } catch (e) {
                document.getElementById('output').textContent = `Ошибка загрузки WebAssembly: ${e}`;
            }
        }
        
        window.runCode = function() {
            if (!wasmReady) {
                document.getElementById('output').textContent = 'WebAssembly еще загружается...';
                return;
            }
            
            const code = document.getElementById('code').value;
            const output = document.getElementById('output');
            const runBtn = document.getElementById('runBtn');
            
            runBtn.disabled = true;
            runBtn.textContent = '⏳ Выполняется...';
            output.textContent = 'Выполняется...';
            
            setTimeout(() => {
                try {
                    const result = run_dr_script(code);
                    output.textContent = result || 'Программа выполнена успешно (без вывода)';
                } catch (e) {
                    output.textContent = `Ошибка: ${e}`;
                } finally {
                    runBtn.disabled = false;
                    runBtn.textContent = '▶️ Запустить';
                }
            }, 10);
        };
        
        window.clearOutput = function() {
            document.getElementById('output').textContent = 'Вывод очищен';
        };
        
        window.loadExample = function(type) {
            const examples = {
                basic: `print("Привет, Dr Script!");
print(42);
print(2 + 3 * 4);`,
                
                variables: `ver x = 10;
var y = 20;
print(x);
print(y);
print(x + y);`,
                
                conditions: `ver x = 15;
var y = 10;

if x > y {
    print("x больше y");
} else {
    print("y больше или равно x");
}`,
                
                loops: `ver i = 1;
while i <= 5 {
    print(i);
    i = i + 1;
}`,
                
                functions: `fun add(a, b) {
    return a + b;
}

fun greet(name) {
    print("Привет, " + name + "!");
}

var result = add(10, 20);
print(result);
greet("Мир");`
            };
            
            document.getElementById('code').value = examples[type] || examples.basic;
        };
        
        initWasm();
    </script>
</body>
</html>
